name: homeassistant
services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.9.4
    network_mode: host
    environment:
      TZ: Europe/Warsaw
    volumes:
      # SELinux wymaga etykiety dostępu do katalogu konfiguracji na Hydropolis.
      - ./config:/config:Z
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9107/', timeout=10)"
      interval: 30s
      timeout: 15s
      start_period: 120s
      retries: 3
